<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归档 - 百谷黍 · baigushu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">baigushu</a>
            <nav>
                <a href="index.html">首页</a>
                <a href="archive.html" class="active">归档</a>
                <a href="about.html">关于</a>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
        </div>
    </header>

    <main class="container">
        <section class="page-header">
            <h1>文章归档</h1>
            <p>共 2 篇文章</p>
        </section>

        <section class="archive">
            <div class="archive-year">
                <h2>2026</h2>
                <ul class="archive-list">
                    <li>
                        <time datetime="2026-09-09">09-09</time>
                        <a href="posts/build-personal-site.html">用纯 HTML + CSS + GitHub Pages 搭起这个网站</a>
                        <span class="post-tag">技术</span>
                    </li>
                    <li>
                        <time datetime="2026-09-05">09-05</time>
                        <a href="posts/hadoop-rental-analysis.html">基于 Hadoop + Hive + Spark 的阜阳租房数据分析</a>
                        <span class="post-tag">大数据</span>
                    </li>
                </ul>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 百谷黍 · baigushu</p>
            <div class="social-links">
                <a href="https://github.com/renaissance-debu" target="_blank" rel="noopener" title="GitHub">GitHub</a>
                <a href="mailto:baigushu666@gmail.com" title="Email">Email</a>
            </div>
        </div>
    </footer>

    <script>
        const toggle = document.getElementById('themeToggle');
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') {
            document.body.classList.add('dark');
            toggle.textContent = '☀️';
        }
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            toggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>
</html>
